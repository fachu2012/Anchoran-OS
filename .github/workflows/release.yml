name: Release

# Builds AnchoranOS.exe and attaches it to a GitHub Release whenever a
# version tag (v1.0.0, v1.0.0-alpha.1, …) is pushed. Tag the same
# version that is in /version.json — see the versioning rules in
# README.md.
on:
  push:
    tags:
      - "v*"

# The default GITHUB_TOKEN is read-only unless a workflow explicitly
# asks for more — without this, creating/attaching to a Release fails
# with "Resource not accessible by integration" even though the build
# itself succeeds.
permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # System Mode's keyboard-hook helper (native/kioskhook) is a
      # small standalone .NET console app, published self-contained so
      # end users need nothing extra installed — see native/kioskhook
      # for the full design notes.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # `npm run dist` runs plain `electron-builder`, which auto-detects
      # CI (GitHub Actions sets that env var) and — because
      # electron-builder.yml now has a `publish` block — tries to
      # publish straight to GitHub itself, which fails without a
      # GH_TOKEN env var here. `--publish never` disables that: this
      # step only builds the files, and the dedicated "Attach to GitHub
      # Release" step below does the actual uploading. This produces
      # AnchoranOS's own NSIS installer — not what end users should
      # run directly (see the next step), but it's what electron-updater
      # silently downloads later for in-place updates, and it's the
      # payload AnchoranSetup bundles for a first install.
      - name: Build AnchoranOS installer
        run: |
          npm run sync-version
          npm run build:renderer
          npm run build:electron
          npm run build:kioskhook
          npx electron-builder --publish never

      # AnchoranSetup: the fullscreen, Anchoran-branded installer end
      # users actually download and run (see installer/README context
      # in the repo root README's "Custom fullscreen installer"
      # section). It bundles the NSIS installer built above and drives
      # it silently behind its own UI.
      - name: Build AnchoranSetup (fullscreen installer)
        run: |
          npm run prepare-installer-source
          cd installer
          npm ci
          npm run build
          npx electron-builder --publish never

      # Anchoran Webstore's catalog for this version: a snapshot of every
      # app that exists as of this release (apps.json is cumulative — it
      # only ever gains entries — so this is naturally "every app up
      # through this version"). Fetched at runtime by a Webstore running
      # THIS version, matched to this release's tag — see
      # src/applications/webstoreRegistry.ts.
      - name: Generate Webstore registry
        run: npm run generate-webstore-registry

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchoran-os-installer
          path: |
            release-setup/*.exe
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/webstore-registry.json

      # Builds the release description from CHANGELOG.md itself, so it
      # never falls back to old boilerplate — pulls out this version's
      # own section (everything between its "## [x.y.z]" heading and
      # the next one) as the "Update summary". A release later found to
      # be non-installable (a critical bug, or superseded by a required
      # newer version) still gets its wording adjusted by hand — see
      # the versioning rules in README.md — this is just the default.
      - name: Build release description
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "**Anchoran OS** \`v$VERSION\` is available for installation and update."
            echo
            echo "Update summary:"
            echo
            awk -v ver="$VERSION" '
              /^## \[/ {
                if (found) exit
                if ($0 ~ ("\\[" ver "\\]")) { found = 1 }
                next
              }
              found { print }
            ' CHANGELOG.md
            echo
            echo "Full Changelog on https://github.com/fachu2012/Anchoran-OS/blob/main/CHANGELOG.md"
          } > release_body.md

      # electron-updater (the auto-update client, see electron/main.ts)
      # reads latest.yml from the release assets to know the current
      # version and download URL for AnchoranOS's own installer — that,
      # its .exe and its .blockmap all need to stay on the release for
      # "anchoran update" / Settings → About to work, even though end
      # users should download AnchoranSetup.exe instead of that one.
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          # Explicit, not relying on the action's defaults: publish
          # immediately (not a draft awaiting manual review) and mark
          # it as the repo's Latest release, so it shows up without a
          # manual step on github.com/…/releases.
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            release-setup/*.exe
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/webstore-registry.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
