name: Release

# Builds AnchoranOS.exe and attaches it to a GitHub Release whenever a
# version tag (v1.0.0, v1.0.0-alpha.1, …) is pushed. Tag the same
# version that is in /version.json — see the versioning rules in
# README.md. A tag containing "-IPU" (e.g. v2.9.9-IPU) ships as an
# Insider Preview Update — a GitHub prerelease, offered only to devices
# with Insider Preview updates enabled — instead of a normal release;
# see the "Determine release channel" step below.
on:
  push:
    tags:
      - "v*"

# The default GITHUB_TOKEN is read-only unless a workflow explicitly
# asks for more — without this, creating/attaching to a Release fails
# with "Resource not accessible by integration" even though the build
# itself succeeds.
permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Every update ships in two stages: first as an Insider Preview
      # Update (a tag like v2.9.9-IPU), a GitHub prerelease that only
      # devices with Insider Preview updates enabled (Settings → About
      # — see the betaChannel/allowPrerelease wiring in electron/main.ts)
      # are offered automatically. Once that build is confirmed bug-free,
      # the exact same version ships again as a plain tag (v2.9.9) — a
      # normal, non-prerelease release everyone gets. This step tells
      # every later step which of those two this run is.
      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          VERSION="${REF#v}"
          if echo "$VERSION" | grep -qi -- '-ipu'; then
            IS_IPU=true
            BASE_VERSION=$(echo "$VERSION" | sed -E 's/-[Ii][Pp][Uu].*$//')
          else
            IS_IPU=false
            BASE_VERSION="$VERSION"
          fi
          # v3.0.0 is the very last release named in the old "vX.Y.Z"
          # style — a device on a pre-3.0.0 client still recognizes it
          # as the newest available release, since the update MECHANISM
          # itself never actually reads this display name (electron-
          # updater compares the real semver embedded in latest.yml,
          # which every release — before or after this switch — always
          # carries; this is purely a courtesy for anyone reading the
          # Releases page by eye). Every release after 3.0.0 uses the
          # new "Version # | Build #H#.#" naming instead.
          if [ "$BASE_VERSION" = "3.0.0" ]; then
            if [ "$IS_IPU" = "true" ]; then
              RELEASE_NAME="v${BASE_VERSION} I.P.U."
            else
              RELEASE_NAME="v${BASE_VERSION}"
            fi
            # Old-style versions never had a build-number form — the
            # simplified label used in release body text is the same
            # "vX.Y.Z" either way for these.
            SIMPLIFIED_LABEL="$RELEASE_NAME"
          else
            MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
            PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)
            BUILD="${MAJOR}H${MINOR}.${PATCH}"
            if [ "$IS_IPU" = "true" ]; then
              RELEASE_NAME="Version ${MAJOR} | Build ${BUILD} I.P.U."
              SIMPLIFIED_LABEL="Build-${BUILD} I.P.U."
            else
              RELEASE_NAME="Version ${MAJOR} | Build ${BUILD}"
              SIMPLIFIED_LABEL="Build-${BUILD}"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_ipu=$IS_IPU" >> "$GITHUB_OUTPUT"
          # RELEASE_NAME (the full "Version # | Build …" form) is reserved
          # for exactly three places: this — the GitHub release's own
          # title — the update-ready screen's title, and Anchover.
          # Everywhere else that names a version, including the release
          # BODY text below, uses the compact SIMPLIFIED_LABEL instead.
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "simplified_label=$SIMPLIFIED_LABEL" >> "$GITHUB_OUTPUT"

      # I.P.U. builds can chain: 2.9.9-IPU, 3.0.0-IPU, 3.0.1-IPU, …, each
      # one superseding the last, with no stable release cut in between —
      # until every change queued for that streak is actually ready. The
      # repo's current "latest" release (GitHub's `/releases/latest` only
      # ever returns a non-prerelease) is that streak's starting point:
      # whichever version was last officially stable. The release
      # description step below uses it to show everything added across
      # the *whole* streak, not just this one version's own section —
      # someone installing after several I.P.U.s shipped in a row
      # shouldn't see only the last one's changes.
      - name: Determine previous stable version
        id: prev
        shell: bash
        run: |
          PREV=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.tag_name?j.tag_name.replace(/^v/,''):'');}catch(e){console.log('')}})")
          echo "prev_version=$PREV" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # System Mode's keyboard-hook helper (native/kioskhook) is a
      # small standalone .NET console app, published self-contained so
      # end users need nothing extra installed — see native/kioskhook
      # for the full design notes.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # `npm run dist` runs plain `electron-builder`, which auto-detects
      # CI (GitHub Actions sets that env var) and — because
      # electron-builder.yml now has a `publish` block — tries to
      # publish straight to GitHub itself, which fails without a
      # GH_TOKEN env var here. `--publish never` disables that: this
      # step only builds the files, and the dedicated "Attach to GitHub
      # Release" step below does the actual uploading. This produces
      # AnchoranOS's own NSIS installer — not what end users should
      # run directly (see the next step), but it's what electron-updater
      # silently downloads later for in-place updates, and it's the
      # payload AnchoranSetup bundles for a first install.
      # An I.P.U. build's OWN version.json gets a real semver prerelease
      # suffix appended here — never committed to the repo, just baked
      # into this specific build — so e.g. "3.0.0" becomes "3.0.0-beta"
      # for the build only. This isn't cosmetic: semver defines a
      # prerelease version as always LOWER precedence than the same
      # X.Y.Z without one, so electron-updater's real version comparison
      # correctly sees the eventual "3.0.0" stable release as newer and
      # actually offers it — without this, both builds carry the exact
      # same version number and compare as equal, silently stranding an
      # Insider Preview device on that build forever (no update ever
      # detected). The identifier is "-beta", not "-IPU" as the tag/
      # display name say — electron-updater's own allowPrerelease logic
      # (GitHubProvider.getLatestVersion) only ever treats "alpha" and
      # "beta" as real prerelease *channels* it can walk forward from
      # into the next stable release; any other identifier (like "IPU")
      # is treated as an unrecognized "custom channel" that it will only
      # ever match against another release of that exact same custom
      # channel, never against a plain stable release — so an insider
      # device would check forever and always see only its own current
      # build, never the stable release that supersedes it. "-beta" is
      # purely this internal, load-bearing detail; nothing user-facing
      # (the git tag, the release name, "Insider Preview build") changes
      # — src/core/buildChannel.ts derives BUILD_CHANNEL from this same
      # suffix at runtime, so Anchover's badge needs no separate marker
      # file, it just now checks for "-beta" instead of "-IPU".
      - name: Set I.P.U. version suffix
        if: steps.channel.outputs.is_ipu == 'true'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const f = 'version.json';
            const v = JSON.parse(fs.readFileSync(f, 'utf-8'));
            v.version = v.version + '-beta';
            fs.writeFileSync(f, JSON.stringify(v, null, 2) + '\n');
            console.log('version.json ->', v.version);
          "

      - name: Build AnchoranOS installer
        run: |
          npm run sync-version
          npm run build:renderer
          npm run build:electron
          npm run build:kioskhook
          npm run build:windowembed
          npx electron-builder --publish never

      # AnchoranSetup: the fullscreen, Anchoran-branded installer end
      # users actually download and run (see installer/README context
      # in the repo root README's "Custom fullscreen installer"
      # section). It bundles the NSIS installer built above and drives
      # it silently behind its own UI.
      - name: Build AnchoranSetup (fullscreen installer)
        run: |
          npm run prepare-installer-source
          cd installer
          npm ci
          npm run build
          npx electron-builder --publish never

      # Anchoran Webstore's catalog for this version: a snapshot of every
      # app that exists as of this release (apps.json is cumulative — it
      # only ever gains entries — so this is naturally "every app up
      # through this version"). Fetched at runtime by a Webstore running
      # THIS version, matched to this release's tag — see
      # src/applications/webstoreRegistry.ts.
      - name: Generate Webstore registry
        run: npm run generate-webstore-registry

      # A small, typed classification of this release — Security,
      # Critical, Stability, Feature, Performance or Maintenance — read
      # from CHANGELOG.md's own "**Update type:**" line for this
      # version. Lets the updater tell someone what *kind* of update
      # they're installing, not just its version number. See
      # src/core/updateInfo.ts and scripts/generate-update-info.cjs.
      - name: Generate update-info.json
        run: npm run generate-update-info

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchoran-os-installer
          path: |
            release-setup/*.exe
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/webstore-registry.json
            release/update-info.json

      # Builds the release description from CHANGELOG.md itself, so it
      # never falls back to old boilerplate — pulls out every version
      # section from this release's own back through (but not including)
      # the last stable release's — i.e. this version's own changes plus
      # every I.P.U.-only version that shipped since the last real
      # release, all of it, as one combined "Update summary". For the
      # very first I.P.U. in a fresh streak that's just this one
      # version's section, same as before. A release later found to be
      # non-installable (a critical bug, or superseded by a required
      # newer version) still gets its wording adjusted by hand — see the
      # versioning rules in README.md — this is just the default.
      - name: Build release description
        shell: bash
        env:
          IS_IPU: ${{ steps.channel.outputs.is_ipu }}
          VERSION: ${{ steps.channel.outputs.base_version }}
          PREV_VERSION: ${{ steps.prev.outputs.prev_version }}
          # The compact form ("Build-#H#.#[ I.P.U.]", or "vX.Y.Z" for the
          # old-style era) — the release body isn't one of the three
          # places (the release's own title, the update-ready screen,
          # Anchover) that use the full "Version # | Build …" form.
          DISPLAY_LABEL: ${{ steps.channel.outputs.simplified_label }}
        run: |
          {
            echo "**Anchoran OS** $DISPLAY_LABEL is available for installation and update."
            echo
            if [ "$IS_IPU" = "true" ]; then
              echo "⚠️ **This is an Insider Preview Update (I.P.U.)** — a pre-release build for testing before it ships to everyone. Only devices with Insider Preview updates enabled (Settings → About) receive it automatically."
              echo
            fi
            echo "Update summary:"
            echo
            awk -v ver="$VERSION" -v prev="$PREV_VERSION" '
              /^## \[/ {
                if (prev != "" && index($0, "[" prev "]") > 0) exit
                if (index($0, "[" ver "]") > 0) { found = 1 }
              }
              found { print }
            ' CHANGELOG.md
            echo
            echo "Full Changelog on https://github.com/fachu2012/Anchoran-OS/blob/main/CHANGELOG.md"
          } > release_body.md

      # electron-updater (the auto-update client, see electron/main.ts)
      # reads latest.yml from the release assets to know the current
      # version and download URL for AnchoranOS's own installer — that,
      # its .exe and its .blockmap all need to stay on the release for
      # "anchoran update" / Settings → About to work, even though end
      # users should download AnchoranSetup.exe instead of that one.
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.channel.outputs.release_name }}
          body_path: release_body.md
          # Explicit, not relying on the action's defaults: publish
          # immediately (not a draft awaiting manual review). An I.P.U.
          # build is marked as a GitHub prerelease — electron-updater's
          # allowPrerelease (toggled by Settings → About → Insider
          # Preview updates, see electron/main.ts) only offers those to
          # devices opted in — and never becomes the repo's "Latest"
          # release, so it can't override the real latest stable build
          # for everyone else.
          draft: false
          prerelease: ${{ steps.channel.outputs.is_ipu == 'true' }}
          make_latest: ${{ steps.channel.outputs.is_ipu == 'true' && 'false' || 'true' }}
          files: |
            release-setup/*.exe
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/webstore-registry.json
            release/update-info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
