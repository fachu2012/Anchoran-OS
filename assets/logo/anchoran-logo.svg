<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Anchoran mark. Geometric, not literal: a ring, a stem, a crossbar
    and a single continuous curve — the anchor is present only as an
    underlying proportion, not as a decorative nautical illustration.
    Single stroke, single color, so it scales cleanly from a taskbar
    icon down to a favicon.
  -->
