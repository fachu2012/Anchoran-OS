    d="M256 178 V 300 M 180 224 H 332 M 152 300 C 152 372 200 404 256 404 C 312 404 360 372 360 300"
    fill="none"
    stroke="#5B84E8"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
