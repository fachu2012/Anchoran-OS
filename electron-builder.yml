appId: com.anchoran.os
productName: Anchoran OS
copyright: Anchoran

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - version.json
  - package.json

extraResources:
  - from: assets
    to: assets
  # System Mode's keyboard-hook helper (native/kioskhook) — built
  # separately via `npm run build:kioskhook` (dotnet publish) before
  # this step, never compiled by electron-builder itself.
  - from: native/kioskhook/bin/Release/net8.0/win-x64/publish/AnchoranKioskHook.exe
    to: AnchoranKioskHook.exe
  # Window-embedding helper (native/windowembed) — same deal, built via
  # `npm run build:windowembed` before this step.
  - from: native/windowembed/bin/Release/net8.0/win-x64/publish/AnchoranWindowEmbed.exe
    to: AnchoranWindowEmbed.exe

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/anchoran-icon.ico
  # Anchoran ships as a normal signed-eligible Windows app; it is not
  # a driver/kernel component, so no special privileges are required.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Anchoran OS
  # Fixed, space-free filename. electron-builder writes this exact name
  # into latest.yml's download URL (the file electron-updater reads to
  # check for updates) regardless of what artifactName says — since our
  # release workflow uploads to GitHub itself (not electron-builder's
  # own --publish), the actual uploaded asset name has to match that
  # computed name exactly, and GitHub's own upload API mangles spaces
  # unpredictably. Pinning this removes the mismatch entirely.
  #
  # Deliberately NOT named anything containing "Setup" or matching
  # AnchoranSetup's own filename: this is the internal NSIS engine —
  # bundled inside AnchoranSetup for first installs, and downloaded
  # silently by electron-updater for in-place updates — never something
  # an end user should run by hand. A near-identical filename to the
  # real installer caused exactly that confusion once already.
  artifactName: AnchoranOS-UpdatePackage-${version}.${ext}

# electron-builder reads the app version from package.json, which is
# kept in sync with the single source of truth (version.json) by
# `npm run sync-version` before every build.

# Auto-update (electron-updater, wired in electron/main.ts) checks
# GitHub Releases on this repo. .github/workflows/release.yml publishes
# a Release with the built .exe on every `vTAG` push, which is what
# this feed reads from — so a real update only exists once that
# workflow has run for a version newer than what's installed.
publish:
  provider: github
  owner: fachu2012
  repo: Anchoran-OS
