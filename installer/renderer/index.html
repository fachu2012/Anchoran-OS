<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Anchoran Setup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="screen">
      <img class="logo" src="logo.svg" alt="" width="56" height="56" />
      <div class="working">Setting up Anchoran OS</div>

      <div class="track">
        <div class="fill" id="progress-fill"></div>
      </div>
      <div class="percent" id="percent">0%</div>

      <div class="blurb">
        Installing Anchoran OS might take a while, and it could restart itself
        several times. Don't turn off your PC.
      </div>

      <div class="stage" id="stage-label">Preparing installation…</div>

      <div class="error" id="error" hidden></div>
    </div>
    <div class="flash" id="flash"></div>
    <script src="renderer.js"></script>
  </body>
</html>
